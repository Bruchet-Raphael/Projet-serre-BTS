<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serre Connectée — Connexion</title>
    <link rel="stylesheet" href="login.css" />
</head>
<body>

    <!-- Feuilles de fond (6 divs, formes CSS pures) -->
    <div class="leaf-1"></div>
    <div class="leaf-2"></div>
    <div class="leaf-3"></div>
    <div class="leaf-4"></div>
    <div class="leaf-5"></div>
    <div class="leaf-6"></div>

    <!-- Particules de pollen -->
    <div class="pollen-field">
        <div class="p"></div>
        <div class="p"></div>
        <div class="p"></div>
        <div class="p"></div>
        <div class="p"></div>
        <div class="p"></div>
        <div class="p"></div>
    </div>

    <!-- Carte de connexion -->
    <div class="login-container">

        <div class="login-header">
            <div class="icon-leaf"></div>
            <h2>Serre Vivante</h2>
            <div class="subtitle">Accès au système · Gestion végétale</div>
        </div>

        <div class="separator">
            <div class="sep-line"></div>
            <div class="sep-leaf"></div>
            <div class="sep-line"></div>
        </div>

        <div class="error">Identifiants incorrects.</div>
        <div class="success">Connexion réussie — bienvenue !</div>

        <div class="field">
            <label for="username">Identifiant</label>
            <div class="input-wrap">
                <input id="username" type="text" placeholder="jardinier@serre.io" />
            </div>
        </div>

        <div class="field">
            <label for="password">Mot de passe</label>
            <div class="input-wrap">
                <input id="password" type="password" placeholder="············" />
            </div>
        </div>

        <button type="button">Entrer dans la serre →</button>

        <div class="login-footer">
            <div class="status-dot"></div>
            <span>Écosystème connecté · 8 zones actives</span>
        </div>

    </div>

</body>
</html>
