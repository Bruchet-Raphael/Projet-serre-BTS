<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - GreenHouse Connect</title>
    <link rel="stylesheet" href="login.css">
</head>
<script>
// Vérification session active au chargement
async function checkAuthLogin() {
    try {
        const response = await fetch("http://172.29.160.160/api/info", {
            method: "GET",
            credentials: "include"
        });

        // Si déjà authentifié, rediriger vers l'accueil
        if (response.ok) {
            window.location.href = "/";
        }
        // Sinon, afficher la page de login (action par défaut)
    } catch (err) {
        console.error("Erreur checkAuthLogin:", err);
        // Pas connecté, afficher la page de login
    }
}
checkAuthLogin();
</script>
<body>

    <!-- Feuilles de fond (CSS clip-path) -->
    <div class="leaf-1"></div>
    <div class="leaf-2"></div>
    <div class="leaf-3"></div>
    <div class="leaf-4"></div>
    <div class="leaf-5"></div>
    <div class="leaf-6"></div>

    <!-- Particules de pollen -->
    <div class="pollen-field">
        <div class="p"></div>
        <div class="p"></div>
        <div class="p"></div>
        <div class="p"></div>
        <div class="p"></div>
        <div class="p"></div>
        <div class="p"></div>
    </div>

    <!-- Carte de connexion -->
    <div class="login-container">

        <div class="login-header">
            <div class="icon-leaf"></div>
            <h2>GreenHouse Connect</h2>
            <div class="subtitle">Accès au système · Gestion végétale</div>
        </div>

        <div class="separator">
            <div class="sep-line"></div>
            <div class="sep-leaf"></div>
            <div class="sep-line"></div>
        </div>

        <div id="errorBox"   class="error"></div>
        <div id="successBox" class="success"></div>

        <div class="field">
            <label for="email">Login</label>
            <div class="input-wrap">
                <input type="text" id="email" placeholder="" required>
            </div>
        </div>

        <div class="field">
            <label for="password">Mot de passe</label>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
        </div>

        <button onclick="login()">Se connecter</button>

        <div class="login-footer">
            <div class="status-dot"></div>
            <span>Écosystème connecté · Serre active</span>
        </div>

        <p>Pas encore de compte ? <a href="/front/inscription.html">Créer un compte</a></p>

    </div>

<script src="login.js"></script>

</body>
</html>
