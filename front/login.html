<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - GreenHouse Connect</title>
    <link rel="stylesheet" href="login.css">
</head>
<script>
// Vérification session active au chargement
async function checkAuthLogin() {
    try {
        const response = await fetch("http://172.29.160.160/api/info", {
            method: "GET",
            credentials: "include"
        });

        // Si déjà authentifié, rediriger vers l'accueil
        if (response.ok) {
            window.location.href = "/";
        }
        // Sinon, afficher la page de login (action par défaut)
    } catch (err) {
        console.error("Erreur checkAuthLogin:", err);
        // Pas connecté, afficher la page de login
    }
}
checkAuthLogin();
</script>
<body>

<div class="login-container">
    <h2>GreenHouse Connect</h2>

    <div id="errorBox" class="error" style="color:red; margin-bottom:10px;"></div>
    <div id="successBox" class="success" style="color:green;"></div>

    <label>Login</label>
    <input type="text" id="email" placeholder="" required>

    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="••••••••" required>

    <button onclick="login()">Se connecter</button>
    
    <p style="margin-top:10px;">
        Pas encore de compte ? <a href="/front/inscription.html">Créer un compte</a>
    </p>
</div>

<script src="login.js"></script>

</body>
</html>
