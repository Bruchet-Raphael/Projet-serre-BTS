<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - GreenHouse</title>
    <link rel="stylesheet" href="/front/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .admin-header h1 {
            font-size: 2rem;
            color: var(--text-primary);
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-btn {
            padding: 0.75rem 1.5rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #4CAF50;
            border-bottom-color: #4CAF50;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .admin-section {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .admin-section h2 {
            font-size: 1.3rem;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
        }

        .users-table, .logs-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th, .logs-table th {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
        }

        .users-table td, .logs-table td {
            padding: 1rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .users-table tr:hover, .logs-table tr:hover {
            background: #f9f9f9;
        }

        .badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            min-width: 80px;
        }

        .badge-admin {
            background: linear-gradient(135deg, #8e44ad, #7d3c98);
            color: white;
        }

        .badge-user {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            color: white;
        }

        .btn-action {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            margin: 0.25rem;
            transition: all 0.3s ease;
        }

        .btn-ban {
            background: #e74c3c;
            color: white;
        }

        .btn-ban:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .btn-unban {
            background: #27ae60;
            color: white;
        }

        .btn-unban:hover {
            background: #229954;
            transform: translateY(-2px);
        }

        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }

        .logs-entry {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            border-left: 4px solid #4CAF50;
        }

        .logs-entry strong {
            color: #333;
        }

        .logs-timestamp {
            font-size: 0.9rem;
            color: #999;
        }

        .back-button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .empty-state p {
            font-size: 1.1rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <path d="M20 5C20 5 10 10 10 20C10 25 12 28 15 30C12 28 10 25 10 20C10 15 15 12 20 10C25 12 30 15 30 20C30 25 28 28 25 30C28 28 30 25 30 20C30 10 20 5 20 5Z" fill="#4CAF50" />
                    <circle cx="20" cy="32" r="3" fill="#8BC34A" />
                </svg>
                <span class="logo-text">GreenHouse Admin</span>
            </div>
            <a href="/" class="back-button">← Retour à la serre</a>
        </div>
    </nav>

    <!-- Admin Content -->
    <div class="admin-container">
        <div class="admin-header">
            <h1>🛡️ Dashboard Administration</h1>
            <div id="statsBox" style="display: flex; gap: 1rem;"></div>
        </div>

        <div id="errorMsg"></div>
        <div id="successMsg"></div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('users')">👥 Utilisateurs</button>
            <button class="tab-btn" onclick="switchTab('logs')">📋 Historique des Actions</button>
        </div>

        <!-- Users Tab -->
        <div id="users" class="tab-content active">
            <div class="admin-section">
                <h2>Gestion des Utilisateurs</h2>
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Login</th>
                            <th>Email</th>
                            <th>Rôle</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTable">
                        <tr><td colspan="5" class="empty-state"><p>Chargement...</p></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Logs Tab -->
        <div id="logs" class="tab-content">
            <div class="admin-section">
                <h2>Historique des Actions</h2>
                <div id="logsContainer">
                    <div class="empty-state"><p>Chargement...</p></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://172.29.160.160/api";
        const token = localStorage.getItem("token");
        const role = localStorage.getItem("role");

        // Vérification sécurité
        if (!token || role !== 'admin') {
            showError("Accès refusé : administrateur requis");
            setTimeout(() => window.location.href = "/", 2000);
        }

        // Changer de tab
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'logs') {
                fetchLogs();
            }
        }

        // Affichage des messages
        function showError(msg) {
            const elem = document.getElementById('errorMsg');
            elem.innerHTML = `<div class="alert alert-error">${msg}</div>`;
        }

        function showSuccess(msg) {
            const elem = document.getElementById('successMsg');
            elem.innerHTML = `<div class="alert alert-success">${msg}</div>`;
            setTimeout(() => elem.innerHTML = '', 3000);
        }

        // Récupérer les utilisateurs
        async function fetchUsers() {
            try {
                const res = await fetch(`${API_URL}/admin/users`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                
                const data = await res.json();
                
                if (!data.success) {
                    showError("Accès refusé : " + data.message);
                    return;
                }

                renderUsers(data.users);
                updateStats(data.count);

            } catch (err) {
                console.error(err);
                showError("Erreur de connexion serveur");
            }
        }

        // Rendu de la table utilisateurs
        function renderUsers(users) {
            const tbody = document.getElementById('userTable');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><p>Aucun utilisateur ne correspond</p></td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>#${user.id}</td>
                    <td><strong>${user.login}</strong></td>
                    <td>${user.mail || '—'}</td>
                    <td><span class="badge badge-${user.role}">${user.role.toUpperCase()}</span></td>
                    <td>
                        <button class="btn-action btn-${user.role === 'admin' ? 'unban' : 'ban'}" 
                            onclick="toggleRole(${user.id}, '${user.role}')">
                            ${user.role === 'admin' ? '👤 Retirer Admin' : '🛡️ Rendre Admin'}
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Récupérer les logs
        async function fetchLogs() {
            try {
                const res = await fetch(`${API_URL}/admin/logs`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                
                const data = await res.json();
                
                if (!data.success) {
                    showError("Erreur lors de la récupération des logs");
                    return;
                }

                renderLogs(data.logs);

            } catch (err) {
                console.error(err);
                showError("Erreur de connexion serveur");
            }
        }

        // Rendu des logs
        function renderLogs(logs) {
            const container = document.getElementById('logsContainer');
            
            if (!logs || logs.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Aucun log disponible</p></div>';
                return;
            }

            container.innerHTML = logs.map(log => {
                const date = new Date(log.timestamp);
                const dateStr = date.toLocaleDateString('fr-FR');
                const timeStr = date.toLocaleTimeString('fr-FR');
                
                return `
                    <div class="logs-entry">
                        <strong>📌 ${log.action}</strong>
                        <p>${log.details || 'Aucun détail'}</p>
                        <span class="logs-timestamp">User ID: ${log.user_id} • ${dateStr} ${timeStr}</span>
                    </div>
                `;
            }).join('');
        }

        // Modifier le rôle d'un utilisateur
        async function toggleRole(userId, currentRole) {
            if (!confirm(`Êtes-vous sûr de cette action ?`)) return;

            try {
                const res = await fetch(`${API_URL}/admin/users/${userId}/role`, {
                    method: 'PUT',
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        newRole: currentRole === 'admin' ? 'user' : 'admin'
                    })
                });

                const data = await res.json();

                if (data.success) {
                    showSuccess("Rôle mis à jour avec succès !");
                    fetchUsers();
                } else {
                    showError(data.message || "Erreur lors de la mise à jour");
                }

            } catch (err) {
                console.error(err);
                showError("Erreur serveur");
            }
        }

        // Mise à jour des statistiques
        function updateStats(count) {
            const statsBox = document.getElementById('statsBox');
            statsBox.innerHTML = `
                <div style="background: #e8f5e9; padding: 1rem; border-radius: 6px; border-left: 4px solid #4CAF50;">
                    <strong>Total Utilisateurs:</strong> ${count}
                </div>
            `;
        }

        // Chargement initial
        fetchUsers();
    </script>

</body>
</html>
